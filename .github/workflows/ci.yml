name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race
        run: go test -race ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o axam ./cmd/axam
      - name: Package
        run: |
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -o dist/axam_linux_amd64 ./cmd/axam
          go run packaging/mkdeb.go -bin dist/axam_linux_amd64 -arch amd64 -version 1.1.0 -out dist/axam_1.1.0_amd64.deb
          dpkg-deb -I dist/axam_1.1.0_amd64.deb
          dpkg-deb -c dist/axam_1.1.0_amd64.deb
