name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X main.version=$VERSION"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "$ldflags" -o dist/axam_linux_amd64 ./cmd/axam
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "$ldflags" -o dist/axam_linux_arm64 ./cmd/axam
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -trimpath -ldflags "$ldflags" -o dist/axam_darwin_amd64 ./cmd/axam
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "$ldflags" -o dist/axam_darwin_arm64 ./cmd/axam

          go run packaging/mkdeb.go \
            -bin dist/axam_linux_amd64 -arch amd64 -version "$VERSION" \
            -out "dist/axam_${VERSION}_amd64.deb"
          go run packaging/mkdeb.go \
            -bin dist/axam_linux_arm64 -arch arm64 -version "$VERSION" \
            -out "dist/axam_${VERSION}_arm64.deb"

          (
            cd dist
            sha256sum \
              axam_linux_amd64 \
              axam_linux_arm64 \
              axam_darwin_amd64 \
              axam_darwin_arm64 \
              "axam_${VERSION}_amd64.deb" \
              "axam_${VERSION}_arm64.deb" > SHA256SUMS
          )

      - name: Inspect Debian packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          dpkg-deb -I "dist/axam_${VERSION}_amd64.deb"
          dpkg-deb -c "dist/axam_${VERSION}_amd64.deb"
          dpkg-deb -I "dist/axam_${VERSION}_arm64.deb"
          dpkg-deb -c "dist/axam_${VERSION}_arm64.deb"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "Axam Studio $GITHUB_REF_NAME"
          fi
